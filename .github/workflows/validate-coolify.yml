name: Validate Coolify deployment

on:
  pull_request:
    paths:
      - 'deploy/coolify/**'
      - 'frontend/Dockerfile'
      - 'frontend/nginx/**'
      - '.github/workflows/validate-coolify.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/coolify/**'
      - 'frontend/Dockerfile'
      - 'frontend/nginx/**'
      - '.github/workflows/validate-coolify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-coolify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-coolify:
    name: Validate Coolify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Render Coolify Compose configuration
        env:
          REPOFLEET_GITHUB_APP_ID: '12345'
          REPOFLEET_GITHUB_INSTALLATION_ID: '67890'
          REPOFLEET_GITHUB_PRIVATE_KEY: 'test-private-key'
          REPOFLEET_AUTH_CLIENT_ID: 'test-client-id'
          REPOFLEET_AUTH_CLIENT_SECRET: 'test-client-secret'
          REPOFLEET_AUTH_SESSION_SECRET: 'test-session-secret'
          REPOFLEET_AUTH_ALLOWED_USERS: 'test-user'
          REPOFLEET_DB_HOST: 'shared-postgres.internal'
          REPOFLEET_DB_PASSWORD: 'ci-only'
        run: |
          set -euo pipefail
          docker compose -f deploy/coolify/compose.yaml config --quiet
          docker compose -f deploy/coolify/compose.yaml config > /tmp/repo-fleet-coolify-compose.yaml

      - name: Validate Coolify service topology
        run: |
          set -euo pipefail
          rendered=/tmp/repo-fleet-coolify-compose.yaml

          if grep -Eq '^  repo-fleet-postgres:$' "$rendered"; then
            echo 'RepoFleet must use the shared Coolify PostgreSQL resource, not a local postgres service.' >&2
            exit 1
          fi
          grep -Eq '^  repo-fleet-backend:$' "$rendered" || {
            echo 'Missing repo-fleet-backend service.' >&2
            exit 1
          }
          grep -Eq '^  repo-fleet-frontend:$' "$rendered" || {
            echo 'Missing repo-fleet-frontend service.' >&2
            exit 1
          }
          if grep -Eq '^  (backend|frontend|postgres):$' "$rendered"; then
            echo 'Generic service name detected; this can reintroduce shared-network DNS collisions.' >&2
            exit 1
          fi
          grep -Fq 'REPOFLEET_DB_URL: jdbc:postgresql://shared-postgres.internal:5432/repofleet' "$rendered" || {
            echo 'Backend database URL does not target REPOFLEET_DB_HOST on the shared PostgreSQL resource.' >&2
            exit 1
          }
          if grep -Fq 'repo-fleet-postgres-data' "$rendered"; then
            echo 'RepoFleet Coolify profile must not own a PostgreSQL data volume.' >&2
            exit 1
          fi
          grep -Fq 'REPOFLEET_BACKEND_HOST: repo-fleet-backend' "$rendered" || {
            echo 'Frontend REPOFLEET_BACKEND_HOST does not target repo-fleet-backend.' >&2
            exit 1
          }
          grep -Fq 'proxy_pass http://${REPOFLEET_BACKEND_HOST}:8080;' frontend/nginx/default.conf.template || {
            echo 'Frontend nginx template does not use the explicit RepoFleet backend host.' >&2
            exit 1
          }
          if grep -Fq 'http://backend:8080' frontend/Dockerfile frontend/nginx/default.conf.template; then
            echo 'Generic backend DNS fallback detected in the frontend image.' >&2
            exit 1
          fi

          echo 'RepoFleet Coolify deployment validation passed.'

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/repo-fleet-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/repo-fleet-backend

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Validate repository policy
        run: python3 scripts/validate-quality-gate.py

      - name: Validate Dockerfiles
        run: python3 scripts/validate-dockerfiles-step-22.py

      - name: Validate Docker Compose model
        run: python3 scripts/validate-compose-step-23.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build:bundle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  publish-images:
    name: Publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-frontend
          - component: backend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-backend

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ${{ matrix.image }}:${{ needs.validate.outputs.sha_tag }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.title=RepoFleet ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

  release:
    name: Package deployment release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate
      - publish-images
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Package deployment assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/package-release.py --output-dir release-dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release-dist/repo-fleet-${{ github.ref_name }}-deployment.zip"
          notes="release-dist/RELEASE-NOTES.md"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$archive" \
              --title "RepoFleet ${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              --verify-tag
          fi

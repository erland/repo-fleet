name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/repo-fleet-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/repo-fleet-backend

jobs:
  validate:
    name: Validate released source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}

    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            echo "Official releases must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          version="${tag#v}"
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Require released commit on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Release ${{ github.event.release.tag_name }} points to ${GITHUB_SHA}, which is not on ${DEFAULT_BRANCH}." >&2
            echo "Create the GitHub Release from a tag that points to the default branch." >&2
            exit 1
          fi
          echo "Released commit ${GITHUB_SHA} is present on ${DEFAULT_BRANCH}."

      - name: Validate repository policy
        run: python3 scripts/validate-quality-gate.py

      - name: Validate Dockerfiles
        run: python3 scripts/validate-dockerfiles-step-22.py

      - name: Validate Docker Compose model
        run: python3 scripts/validate-compose-step-23.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build:bundle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  publish-images:
    name: Publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-frontend
          - component: backend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-backend

    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ${{ matrix.image }}:${{ needs.validate.outputs.sha_tag }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.title=RepoFleet ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.event.release.tag_name }}

  package-release:
    name: Attach deployment package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate
      - publish-images
    permissions:
      contents: write

    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package deployment assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/package-release.py --output-dir release-dist

      - name: Attach deployment package to published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release-dist/repo-fleet-${RELEASE_TAG}-deployment.zip"
          gh release upload "$RELEASE_TAG" "$archive" --clobber

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build backend
        run: mvn --batch-mode --no-transfer-progress verify

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Dockerfiles
        run: python3 scripts/validate-dockerfiles-step-22.py

      - name: Build and smoke-test containers
        run: bash scripts/verify-step-22.sh

      - name: Validate Docker Compose runtime
        run: python3 scripts/validate-compose-step-23.py

      - name: Smoke-test Docker Compose runtime
        run: bash scripts/verify-step-23.sh


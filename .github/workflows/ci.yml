name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate repository policy
        run: python3 scripts/validate-quality-gate.py

      - name: Validate Dockerfiles
        run: python3 scripts/validate-dockerfiles-step-22.py

      - name: Validate Docker Compose model
        run: python3 scripts/validate-compose-step-23.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Run tests and Phase 1 acceptance suite
        run: npm test

      - name: Build production frontend bundle
        run: npm run build:bundle

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build backend
        run: mvn --batch-mode --no-transfer-progress verify

  product:
    name: Production containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - policy
      - frontend
      - backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and smoke-test complete Docker Compose runtime
        run: bash scripts/verify-step-23.sh

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - policy
      - frontend
      - backend
      - product

    steps:
      - name: Require all quality jobs
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PRODUCT_RESULT: ${{ needs.product.result }}
        run: |
          for result in "$POLICY_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$PRODUCT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Quality gate failed: policy=$POLICY_RESULT frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT product=$PRODUCT_RESULT"
              exit 1
            fi
          done
          echo "RepoFleet Quality Gate passed."

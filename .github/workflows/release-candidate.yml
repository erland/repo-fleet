name: Publish release candidate
run-name: Publish RepoFleet ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable RC version, for example 1.1.0-rc.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repo-fleet-release-candidate-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate release candidate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}

    steps:
      - name: Require default branch dispatch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Release candidates must be published from the default branch (${DEFAULT_BRANCH})." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate RC version
        id: version
        env:
          RC_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Invalid release candidate version: $RC_VERSION" >&2
            echo "Expected format: MAJOR.MINOR.PATCH-rc.NUMBER" >&2
            exit 1
          fi
          echo "version=$RC_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate repository policy
        run: python3 scripts/validate-quality-gate.py

      - name: Validate Phase 1 completion documentation
        run: python3 scripts/validate-phase1-completion.py

      - name: Validate Dockerfiles
        run: python3 scripts/validate-dockerfiles-step-22.py

      - name: Validate Docker Compose model
        run: python3 scripts/validate-compose-step-23.py

      - name: Validate deployment model
        run: python3 scripts/validate-deployment-step.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build:bundle

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  publish-images:
    name: Publish release candidate images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-frontend
          - component: backend
            image: ghcr.io/${{ github.repository_owner }}/repo-fleet-backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ${{ matrix.image }}:${{ needs.validate.outputs.sha_tag }}
            ${{ matrix.image }}:rc
          labels: |
            org.opencontainers.image.title=RepoFleet ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.prerelease=true

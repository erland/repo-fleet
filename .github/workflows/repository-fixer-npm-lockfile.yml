name: Repository Fixer npm lockfile

on:
  push:
    branches:
      - repository-fixer/npm-lockfile
    paths:
      - .github/workflows/repository-fixer-npm-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out working branch
        uses: actions/checkout@v7
        with:
          ref: repository-fixer/npm-lockfile

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Update Dockerfile and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('frontend/Dockerfile'): [
                  ('COPY package.json ./', 'COPY package.json package-lock.json ./'),
                  ('RUN npm install --no-audit --no-fund', 'RUN npm ci --no-audit --no-fund'),
              ],
              Path('README.md'): [
                  ('npm install\nnpm run dev', 'npm ci\nnpm run dev'),
                  ('npm install\nnpm run typecheck', 'npm ci\nnpm run typecheck'),
              ],
              Path('docs/local-development.md'): [
                  ('npm install\nnpm run dev', 'npm ci\nnpm run dev'),
                  ('npm install\nnpm run typecheck', 'npm ci\nnpm run typecheck'),
              ],
              Path('docs/ci-quality-gate.md'): [
                  ('npm install\nnpm run typecheck', 'npm ci\nnpm run typecheck'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify clean lockfile install
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build:bundle

      - name: Commit generated lockfile and non-workflow changes
        shell: bash
        run: |
          git config user.name "Erland Lindmark"
          git config user.email "erland@isaksson.info"
          git add frontend/package-lock.json \
            frontend/Dockerfile \
            README.md \
            docs/local-development.md \
            docs/ci-quality-gate.md
          git commit -m "Lock frontend dependencies for reproducible builds"
          git push origin HEAD:repository-fixer/npm-lockfile

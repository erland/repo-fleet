quarkus.http.port=8080

# GitHub REST API client. Runtime configuration can override this for GitHub Enterprise/testing.
quarkus.rest-client.github-api.url=${GITHUB_API_URL:https://api.github.com}

# GitHub App configuration is intentionally optional so the application and CI tests can run
# without secrets. Configure these when enabling the real GitHub connection:
# REPOFLEET_GITHUB_APP_ID=<GitHub App ID or client ID>
# REPOFLEET_GITHUB_INSTALLATION_ID=<installation ID>
# REPOFLEET_GITHUB_PRIVATE_KEY_PATH=/run/secrets/github-app.pem
# Alternatively REPOFLEET_GITHUB_PRIVATE_KEY may contain PEM text (literal newlines or escaped \n).
repofleet.github.token-refresh-margin-seconds=${REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:300}

quarkus.http.port=8080

# GitHub REST API client. Runtime configuration can override this for GitHub Enterprise/testing.
quarkus.rest-client.github-api.url=${GITHUB_API_URL:https://api.github.com}

# GitHub App configuration is intentionally optional so the application and CI tests can run
# without secrets. Configure these when enabling the real GitHub connection:
# REPOFLEET_GITHUB_APP_ID=<GitHub App ID>
# REPOFLEET_GITHUB_INSTALLATION_ID=<installation ID>
# REPOFLEET_GITHUB_PRIVATE_KEY_PATH=/run/secrets/github-app.pem
# Alternatively REPOFLEET_GITHUB_PRIVATE_KEY may contain PEM text (literal newlines or escaped \n).
repofleet.github.token-refresh-margin-seconds=${REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:300}
repofleet.github.webhook-secret=${REPOFLEET_GITHUB_WEBHOOK_SECRET:}
%test.repofleet.github.webhook-secret=test-webhook-secret

# Optional GitHub user authentication. Disabled by default so local development and CI remain simple.
repofleet.auth.enabled=${REPOFLEET_AUTH_ENABLED:false}
repofleet.auth.client-id=${REPOFLEET_AUTH_CLIENT_ID:}
repofleet.auth.client-secret=${REPOFLEET_AUTH_CLIENT_SECRET:}
repofleet.auth.session-secret=${REPOFLEET_AUTH_SESSION_SECRET:}
repofleet.auth.callback-url=${REPOFLEET_AUTH_CALLBACK_URL:}
repofleet.auth.session-hours=${REPOFLEET_AUTH_SESSION_HOURS:12}
repofleet.auth.cookie-secure=${REPOFLEET_AUTH_COOKIE_SECURE:true}
repofleet.auth.github-web-base-url=${REPOFLEET_AUTH_GITHUB_WEB_BASE_URL:https://github.com}
repofleet.auth.github-api-base-url=${GITHUB_API_URL:https://api.github.com}

# Phase 2 persistence foundation. Repository inventory remains in-memory until later Phase 2 steps.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${REPOFLEET_DB_USER:repofleet}
quarkus.datasource.password=${REPOFLEET_DB_PASSWORD:repofleet}
quarkus.datasource.jdbc.url=${REPOFLEET_DB_URL:jdbc:postgresql://localhost:5432/repofleet}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

# Phase 2 refresh policy. Values are in minutes/hours and can be overridden per environment.
repofleet.refresh.identity-freshness-minutes=${REPOFLEET_REFRESH_IDENTITY_FRESHNESS_MINUTES:15}
repofleet.refresh.enrichment-freshness-minutes=${REPOFLEET_REFRESH_ENRICHMENT_FRESHNESS_MINUTES:60}
repofleet.refresh.topics-freshness-minutes=${REPOFLEET_REFRESH_TOPICS_FRESHNESS_MINUTES:60}
repofleet.refresh.languages-freshness-minutes=${REPOFLEET_REFRESH_LANGUAGES_FRESHNESS_MINUTES:60}
repofleet.refresh.license-freshness-minutes=${REPOFLEET_REFRESH_LICENSE_FRESHNESS_MINUTES:240}
repofleet.refresh.workflows-freshness-minutes=${REPOFLEET_REFRESH_WORKFLOWS_FRESHNESS_MINUTES:60}
repofleet.refresh.releases-freshness-minutes=${REPOFLEET_REFRESH_RELEASES_FRESHNESS_MINUTES:60}
repofleet.refresh.full-consistency-hours=${REPOFLEET_REFRESH_FULL_CONSISTENCY_HOURS:24}

# Bounded repository enrichment concurrency. Keep conservative to protect GitHub API headroom.
repofleet.refresh.enrichment-workers=${REPOFLEET_REFRESH_ENRICHMENT_WORKERS:2}
repofleet.refresh.usage-check-interval-minutes=${REPOFLEET_REFRESH_USAGE_CHECK_INTERVAL_MINUTES:60}
repofleet.refresh.targeted-queue-enabled=${REPOFLEET_REFRESH_TARGETED_QUEUE_ENABLED:true}
repofleet.refresh.targeted-workers=${REPOFLEET_REFRESH_TARGETED_WORKERS:2}
repofleet.refresh.consistency-scheduler-enabled=${REPOFLEET_REFRESH_CONSISTENCY_SCHEDULER_ENABLED:false}
repofleet.refresh.consistency-interval-hours=${REPOFLEET_REFRESH_CONSISTENCY_INTERVAL_HOURS:24}
%test.repofleet.refresh.targeted-queue-enabled=false
%test.repofleet.refresh.consistency-scheduler-enabled=false

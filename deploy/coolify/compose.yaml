name: repo-fleet

services:
  repo-fleet-backend:
    image: ${REPOFLEET_BACKEND_IMAGE:-ghcr.io/erland/repo-fleet-backend}:${REPOFLEET_VERSION:-latest}
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      REPOFLEET_GITHUB_APP_ID: ${REPOFLEET_GITHUB_APP_ID:?Set REPOFLEET_GITHUB_APP_ID in Coolify}
      REPOFLEET_GITHUB_INSTALLATION_ID: ${REPOFLEET_GITHUB_INSTALLATION_ID:?Set REPOFLEET_GITHUB_INSTALLATION_ID in Coolify}
      REPOFLEET_GITHUB_PRIVATE_KEY: ${REPOFLEET_GITHUB_PRIVATE_KEY:?Set REPOFLEET_GITHUB_PRIVATE_KEY in Coolify}
      REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS: ${REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:-300}
      REPOFLEET_AUTH_ENABLED: ${REPOFLEET_AUTH_ENABLED:-true}
      REPOFLEET_AUTH_CLIENT_ID: ${REPOFLEET_AUTH_CLIENT_ID:?Set REPOFLEET_AUTH_CLIENT_ID in Coolify}
      REPOFLEET_AUTH_CLIENT_SECRET: ${REPOFLEET_AUTH_CLIENT_SECRET:?Set REPOFLEET_AUTH_CLIENT_SECRET in Coolify}
      REPOFLEET_AUTH_SESSION_SECRET: ${REPOFLEET_AUTH_SESSION_SECRET:?Set REPOFLEET_AUTH_SESSION_SECRET in Coolify}
      REPOFLEET_AUTH_CALLBACK_URL: ${REPOFLEET_AUTH_CALLBACK_URL:-https://repo-fleet.apps.isaksson.info/api/auth/github/callback}
      REPOFLEET_AUTH_ALLOWED_USERS: ${REPOFLEET_AUTH_ALLOWED_USERS:?Set REPOFLEET_AUTH_ALLOWED_USERS in Coolify}
      REPOFLEET_AUTH_SESSION_HOURS: ${REPOFLEET_AUTH_SESSION_HOURS:-12}
      REPOFLEET_AUTH_COOKIE_SECURE: ${REPOFLEET_AUTH_COOKIE_SECURE:-true}
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  repo-fleet-frontend:
    image: ${REPOFLEET_FRONTEND_IMAGE:-ghcr.io/erland/repo-fleet-frontend}:${REPOFLEET_VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://repo-fleet-backend:8080
    depends_on:
      repo-fleet-backend:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

networks:
  app:

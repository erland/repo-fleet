name: repo-fleet

services:
  backend:
    image: ${REPOFLEET_BACKEND_IMAGE:?REPOFLEET_BACKEND_IMAGE must be set}
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      REPOFLEET_GITHUB_APP_ID: ${REPOFLEET_GITHUB_APP_ID:?REPOFLEET_GITHUB_APP_ID must be set}
      REPOFLEET_GITHUB_INSTALLATION_ID: ${REPOFLEET_GITHUB_INSTALLATION_ID:?REPOFLEET_GITHUB_INSTALLATION_ID must be set}
      REPOFLEET_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS: ${REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:-300}
      REPOFLEET_AUTH_ENABLED: ${REPOFLEET_AUTH_ENABLED:-true}
      REPOFLEET_AUTH_CLIENT_ID: ${REPOFLEET_AUTH_CLIENT_ID:?REPOFLEET_AUTH_CLIENT_ID must be set}
      REPOFLEET_AUTH_CLIENT_SECRET: ${REPOFLEET_AUTH_CLIENT_SECRET:?REPOFLEET_AUTH_CLIENT_SECRET must be set}
      REPOFLEET_AUTH_SESSION_SECRET: ${REPOFLEET_AUTH_SESSION_SECRET:?REPOFLEET_AUTH_SESSION_SECRET must be set}
      REPOFLEET_AUTH_CALLBACK_URL: ${REPOFLEET_AUTH_CALLBACK_URL:-https://repo-fleet.isaksson.info/api/auth/github/callback}
      REPOFLEET_AUTH_ALLOWED_USERS: ${REPOFLEET_AUTH_ALLOWED_USERS:?REPOFLEET_AUTH_ALLOWED_USERS must be set}
      REPOFLEET_AUTH_SESSION_HOURS: ${REPOFLEET_AUTH_SESSION_HOURS:-12}
      REPOFLEET_AUTH_COOKIE_SECURE: ${REPOFLEET_AUTH_COOKIE_SECURE:-true}
    volumes:
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    networks:
      - repofleet

  frontend:
    image: ${REPOFLEET_FRONTEND_IMAGE:?REPOFLEET_FRONTEND_IMAGE must be set}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${REPOFLEET_FRONTEND_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - repofleet

networks:
  repofleet:
    driver: bridge

server {
    listen 80;
    listen [::]:80;
    server_name repo-fleet.isaksson.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        auth_basic off;
    }

    location / {
        default_type text/plain;
        return 200 "RepoFleet HTTPS bootstrap\n";
    }
}

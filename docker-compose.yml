name: ${COMPOSE_PROJECT_NAME:-repo-fleet}

services:
  backend:
    image: ${REPOFLEET_BACKEND_IMAGE:-repo-fleet-backend:local}
    build:
      context: ./backend
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      REPOFLEET_GITHUB_APP_ID: ${REPOFLEET_GITHUB_APP_ID:-}
      REPOFLEET_GITHUB_INSTALLATION_ID: ${REPOFLEET_GITHUB_INSTALLATION_ID:-}
      REPOFLEET_GITHUB_PRIVATE_KEY: ${REPOFLEET_GITHUB_PRIVATE_KEY:-}
      REPOFLEET_GITHUB_PRIVATE_KEY_PATH: ${REPOFLEET_GITHUB_PRIVATE_KEY_PATH:-}
      REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS: ${REPOFLEET_GITHUB_TOKEN_REFRESH_MARGIN_SECONDS:-300}
    ports:
      - "127.0.0.1:${REPOFLEET_BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    networks:
      - repofleet

  frontend:
    image: ${REPOFLEET_FRONTEND_IMAGE:-repo-fleet-frontend:local}
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${REPOFLEET_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - repofleet

networks:
  repofleet:
    driver: bridge
